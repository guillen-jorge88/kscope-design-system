<!-- projects/ui/src/lib/atoms/icon/icon.html -->
<span
  class="ks-icon__wrapper"
  [class.ks-icon--spin]="spin()"
  [style.transform]="transformStyle()"
  [attr.aria-hidden]="!ariaLabel()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.role]="ariaLabel() ? 'img' : null"
>
  @switch (library()) {
    @case ('material') {
      <span class="material-icons" [class.ks-icon--filled]="filled()">
        {{ name() }}
      </span>
    }
    @case ('fontawesome') {
      <i [class]="'fa-' + (filled() ? 'solid' : 'regular') + ' fa-' + name()"></i>
    }
    @default {
      <!-- Custom SVG inline o CSS icon class -->
      <i class="ks-icon__element" [class]="name()"></i>
    }
  }
</span>
